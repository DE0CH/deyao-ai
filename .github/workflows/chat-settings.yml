name: chat-settings
# The chat's settings (k8s/chat/settings.json) checked by the hermit-jarvis image k8s/chat/hermit.yaml pins, the build
# that reads the file at its start: `hermit-jarvis check-settings` fails on a file it would refuse, among others a model
# that names no `reasoning` of its own (Deyao, 2026-11-17: each model's thinking level is its own choice, no default).
# chat-pin.yml runs the same check on a new hermit-jarvis before pinning it.
on:
  push:  # every branch: the gate waits for it
    paths: [k8s/chat/settings.json, k8s/chat/hermit.yaml, .github/workflows/chat-settings.yml]
  pull_request:
    paths: [k8s/chat/settings.json, k8s/chat/hermit.yaml, .github/workflows/chat-settings.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: hermit-jarvis check-settings with the pinned image
        run: |
          set -euo pipefail
          image="$(grep -ho 'ghcr.io/de0ch/hermit-jarvis:[^ ]*' k8s/chat/hermit.yaml | head -1)"
          echo "image: $image"
          docker run --rm -v "$PWD/k8s/chat:/chat:ro" "$image" check-settings /chat/settings.json
