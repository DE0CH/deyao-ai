# Jarvis 4's chat (DE0CH/jarvis4 aviary/README.md): aviary's pigeon and magpie (the same builds as YYC AI), Jarvis 4's
# hermit-jarvis, their Postgres chat-db. https://chat.deyaochen.com (pigeon) and https://chat-gw.deyaochen.com (the
# session machines' gateway listener), both through the tunnel `services` (k8s/edge) behind Access (infra/cloudflare.py).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [db.yaml, magpie.yaml, pigeon.yaml, hermit.yaml, network.yaml]
# The chat's own look (DE0CH/claudecodeui paseo/packages/app src/yyc/brand.ts): the app bundle holds neutral files
# under /branding/; pigeon mounts these over them. A change of a file renames the
# ConfigMap (its hash), which rolls pigeon.
configMapGenerator:
  - name: pigeon-branding
    namespace: services
    files:
      - branding/logo.png
      - branding/favicon.png
      - branding/favicon-running.png
      - branding/favicon-attention.png
      - branding/apple-touch-icon.png
      - branding/icon-192.png
      - branding/icon-512.png
      - branding/manifest.json
